name: Flatpak bundle

# Clean release builds happen here, not on maintainer machines. Publishing
# a GitHub release (or manually dispatching with a tag) builds the bundle
# from that tag in a pristine container and attaches Grab.flatpak back to
# the release. No local bundle step remains in the release process.
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag to (re)build the bundle for"
        required: true

jobs:
  bundle:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    timeout-minutes: 90
    steps:
      - name: Check out the release tag
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.release.tag_name || inputs.tag }}

      - name: Install Flatpak tooling
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq flatpak flatpak-builder python3

      - name: Install GNOME SDK and Platform
        run: |
          RUNTIME=$(python3 -c "import json; print(json.load(open('build-aux/io.github.houssemko.Grab.json'))['runtime-version'])")
          flatpak remote-add --user --if-not-exists flathub https://flathub.org/repo/flathub.flatpakrepo
          flatpak install --user -y flathub "org.gnome.Platform//$RUNTIME" "org.gnome.Sdk//$RUNTIME"

      - name: Regenerate vendored cargo sources
        run: python3 build-aux/gen-cargo-sources.py

      # --user: the flathub remote above is user-scoped, so dependency
      # resolution must run in user scope too (system scope can't see it).
      - name: Clean Flatpak build
        run: >
          flatpak-builder --force-clean --user --repo=flatpak-repo
          --install-deps-from=flathub build
          build-aux/io.github.houssemko.Grab.json

      - name: Bundle
        run: flatpak build-bundle flatpak-repo Grab.flatpak io.github.houssemko.Grab

      - name: Attach to the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: |
          ls -lh Grab.flatpak
          gh release upload "$TAG" Grab.flatpak --clobber
