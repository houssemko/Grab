name: Flatpak build

# Shared build chain for release bundles and PR test bundles. Every build
# is pristine (--force-clean, no SDK cache): validation must never depend
# on what a previous run left behind. Release mode attaches the bundle to
# the release; test mode uploads it as a workflow artifact instead.
on:
  workflow_call:
    inputs:
      ref:
        description: "Ref to check out"
        required: true
        type: string
      force-clean:
        description: "Pristine build directory"
        default: true
        type: boolean
      release-tag:
        description: "Attach the bundle here; empty uploads an artifact instead"
        default: ""
        type: string

jobs:
  bundle:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ inputs.ref }}

      # The GNOME SDK/Platform are immutable per runtime version and
      # would otherwise re-download (~1 min + GBs) on every pristine
      # build. Only this layer is cached; the build itself stays
      # --force-clean. `flatpak install` below stays as-is: on a cache
      # hit it is a fast no-op (or small delta refresh).
      - name: Cache GNOME SDK and Platform
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.local/share/flatpak
            ~/.cache/flatpak
          key: flatpak-sdk-${{ runner.os }}-${{ hashFiles('build-aux/io.github.houssemko.Grab.json') }}
          restore-keys: |
            flatpak-sdk-${{ runner.os }}-

      - name: Install Flatpak tooling
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq flatpak flatpak-builder python3

      - name: Install GNOME SDK and Platform
        run: |
          RUNTIME=$(python3 -c "import json; print(json.load(open('build-aux/io.github.houssemko.Grab.json'))['runtime-version'])")
          flatpak remote-add --user --if-not-exists flathub https://flathub.org/repo/flathub.flatpakrepo
          flatpak install --user -y flathub "org.gnome.Platform//$RUNTIME" "org.gnome.Sdk//$RUNTIME"

      - name: Regenerate vendored cargo sources
        run: python3 build-aux/gen-cargo-sources.py

      # --user: the flathub remote above is user-scoped, so dependency
      # resolution must run in user scope too (system scope can't see it).
      - name: Flatpak build
        run: >
          flatpak-builder ${{ inputs.force-clean && '--force-clean' || '' }} --user
          --repo=flatpak-repo --install-deps-from=flathub build
          build-aux/io.github.houssemko.Grab.json

      - name: Bundle
        run: flatpak build-bundle flatpak-repo Grab.flatpak io.github.houssemko.Grab

      - name: Attach to the release
        if: inputs.release-tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.release-tag }}
        run: |
          ls -lh Grab.flatpak
          gh release upload "$TAG" Grab.flatpak --clobber

      - name: Upload test bundle
        if: inputs.release-tag == ''
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: Grab.flatpak
          path: Grab.flatpak
          retention-days: 14
