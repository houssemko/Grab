name: Flatpak test bundle

# On-demand test builds for local testing: builds Grab.flatpak from any
# branch, tag, or SHA in CI and uploads it as a workflow artifact to
# download. Nothing touches releases. Manual dispatch only (no PR runs:
# packaging validation happens on the release builds). Always a full
# pristine build (--force-clean): validation must never depend on what
# a previous run left behind. Only the SDK layer is cached.
on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Branch, tag, or SHA to build"
        required: false
        default: "main"

jobs:
  bundle:
    uses: ./.github/workflows/flatpak-build.yml
    with:
      ref: ${{ inputs.ref }}
      force-clean: true
