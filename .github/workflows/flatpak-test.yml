name: Flatpak test bundle

# On-demand test builds for local testing: builds Grab.flatpak from any
# branch, tag, or SHA in CI and uploads it as a workflow artifact to
# download. Nothing touches releases. Also runs automatically on pull
# requests touching code, data, translations, or packaging. Always a full
# pristine build (--force-clean, no SDK cache): validation must never
# depend on what a previous run left behind.
on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Branch, tag, or SHA to build"
        required: false
        default: "main"
  pull_request:
    paths:
      - "src/**"
      - "data/**"
      - "po/**"
      - "build-aux/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "meson.build"
      - ".github/workflows/flatpak-test.yml"
      - ".github/workflows/flatpak-build.yml"

# Same supersede rule as CI: a new push cancels the stale bundle build.
# Manual dispatches (exact tags/SHAs) never cancel.
concurrency:
  group: flatpak-test-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  bundle:
    uses: ./.github/workflows/flatpak-build.yml
    with:
      # Dispatch input when manually run, PR merge commit otherwise.
      ref: ${{ inputs.ref || github.sha }}
      force-clean: true
