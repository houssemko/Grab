name: CI

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    # ubuntu-latest ships GTK 4.14 / libadwaita 1.4, but the gtk4 (v4_18)
    # and libadwaita (v1_8) crate features need system libs >= 4.18 / 1.8,
    # so run inside Fedora instead of on the host runner.
    container: fedora:44
    steps:
      - name: Install system dependencies
        run: dnf install -y git nodejs gcc pkg-config gtk4-devel libadwaita-devel python3
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test
