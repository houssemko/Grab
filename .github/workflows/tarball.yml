name: Prebuilt tarball

# Official prebuilt archive for third-party repackagers (e.g. FlatPark,
# which wraps the vendor's own bytes and never builds from source).
# Publishing a GitHub release (or manually dispatching with a tag) builds
# the install tree from that tag inside the GNOME SDK — the same libc the
# Flatpak runtime ships — and attaches Grab-<ver>-linux-x86_64.tar.gz back
# to the release. A .flatpak bundle is deliberately NOT used here: it is
# not an accepted vendor payload.
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag to (re)build the tarball for"
        required: true

jobs:
  tarball:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ github.event.release.tag_name || inputs.tag }}

      - name: Install Flatpak tooling
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq flatpak

      - name: Install GNOME SDK and Rust
        run: |
          RUNTIME=$(python3 -c "import json; print(json.load(open('build-aux/io.github.houssemko.Grab.json'))['runtime-version'])")
          echo "RUNTIME=$RUNTIME" >> "$GITHUB_ENV"
          flatpak remote-add --user --if-not-exists flathub https://flathub.org/repo/flathub.flatpakrepo
          flatpak install --user -y flathub "org.gnome.Sdk//$RUNTIME" "org.freedesktop.Sdk.Extension.rust-stable//25.08"

      # Same offline-vendor trick as the Flatpak build, done by hand:
      # cargo vendor + a local source replacement, then meson install
      # into a staging dir. Everything runs inside the SDK sandbox.
      - name: Build install tree in the SDK
        run: |
          flatpak run --command=bash --filesystem="$PWD" --share=network \
            --env=FLATPAK_ENABLE_SDK_EXT=rust-stable "org.gnome.Sdk//$RUNTIME" -c "
            set -eu
            cd \"$PWD\"
            export PATH=\"/usr/lib/sdk/rust-stable/bin:\$PATH\"
            export CARGO_HOME=\"$PWD/.cargo-home\" CARGO_TARGET_DIR=\"$PWD/build-target\"
            cargo vendor vendor
            mkdir -p .cargo
            printf '[source.crates-io]\nreplace-with = \"vendored-sources\"\n[source.vendored-sources]\ndirectory = \"vendor\"\n' > .cargo/config.toml
            meson setup build --prefix=/usr --buildtype=release
            meson compile -C build
            DESTDIR=\"$PWD/staging\" meson install -C build
            # gnome.post_install skips DESTDIR staging, so compile here: without
            # gschemas.compiled the binary aborts on startup outside Flatpak.
            glib-compile-schemas \"$PWD/staging/usr/share/glib-2.0/schemas\"
            "

      - name: Pack and attach to the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: |
          VER="${TAG#v}"
          TARBALL="Grab-$VER-linux-x86_64.tar.gz"
          tar -czf "$TARBALL" -C staging usr
          tar tzf "$TARBALL" | head -8
          ls -lh "$TARBALL"
          test -f "staging/usr/bin/grab"
          gh release upload "$TAG" "$TARBALL" --clobber
